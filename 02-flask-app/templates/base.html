<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flat Force One{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <a class="site-title" href="{{ url_for('home') }}">Flat Force One</a>
      <nav aria-label="Navigation">
        <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Expenses</a>
        <a href="{{ url_for('settlement') }}" {% if request.endpoint == 'settlement' %}aria-current="page"{% endif %}>Settle up</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
